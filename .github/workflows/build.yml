name: Build debug APK

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Gradle project is the launcher/ subdirectory (settings.gradle lives there).
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (plus lint for minSdk 21 API checks)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug lintDebug

      - name: Show APK details
        if: always()
        run: |
          ls -l app/build/outputs/apk/debug/ || true
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt"
          echo "aapt: $AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | head -8 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-api21-debug
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            launcher/app/build/reports/lint-results-debug.html
            launcher/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
